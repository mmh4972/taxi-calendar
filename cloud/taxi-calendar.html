<title>洗腎叫車</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：週一開頭的月曆格，點日子從下方拉出視窗 */
:root {
  --bg: #f4f6f3; --card: #ffffff; --ink: #1f2420; --muted: #646d67; --line: #dfe3dd;
  --red: #d63c31; --red-bg: #fde3e0;
  --yellow-ink: #8a6500; --yellow: #d9a400; --yellow-bg: #fff2c2;
  --green: #23874f; --green-bg: #d9f1e2;
  --gray: #8b918c; --gray-bg: #eaece8;
  --today: #2f6fd6; --shade: rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151816; --card: #212522; --ink: #eceee9; --muted: #9ba39d; --line: #343a36;
    --red: #ff6b5e; --red-bg: #4a2320;
    --yellow-ink: #f5c931; --yellow: #f5c931; --yellow-bg: #4a3d12;
    --green: #4fc983; --green-bg: #1c3c29;
    --gray: #8a8f8a; --gray-bg: #2e322f;
    --today: #6ea2ff; --shade: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151816; --card: #212522; --ink: #eceee9; --muted: #9ba39d; --line: #343a36;
  --red: #ff6b5e; --red-bg: #4a2320;
  --yellow-ink: #f5c931; --yellow: #f5c931; --yellow-bg: #4a3d12;
  --green: #4fc983; --green-bg: #1c3c29;
  --gray: #8a8f8a; --gray-bg: #2e322f;
  --today: #6ea2ff; --shade: rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px;
  padding-block: 8px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
header { display: flex; align-items: center; gap: 6px; }
header h1 { flex: 1; text-align: center; font-size: 22px; margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.nav { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 22px; }
.small-btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
.summary b { font-variant-numeric: tabular-nums; }
.summary b.red { color: var(--red); }
.summary b.yellow { color: var(--yellow); }
.summary b.green { color: var(--green); }
.sync { font-size: 12px; color: var(--muted); text-align: center; }
.sync.bad { color: var(--red); }
.weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.weekdays div { text-align: center; font-size: 13px; color: var(--muted); padding: 2px 0; }
.weekdays .we { color: var(--red); }
.cell {
  min-height: 70px; border-radius: 10px; background: var(--card); border: 1px solid var(--line);
  padding: 4px 3px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; min-width: 0;
}
.cell.empty { background: transparent; border: none; cursor: default; }
.cell.past { opacity: .55; }
.cell.today { border: 2px solid var(--today); }
.num { font-size: 15px; font-weight: 600; padding-left: 2px; font-variant-numeric: tabular-nums; }
.cell.today .num { color: var(--today); }
.trip { font-size: 13px; line-height: 26px; border-radius: 6px; text-align: center; font-weight: 600; white-space: nowrap; }
.s-none { background: var(--red-bg); color: var(--red); }
.s-booked { background: var(--yellow-bg); color: var(--yellow-ink); }
.s-ok { background: var(--green-bg); color: var(--green); }
.s-skip { background: var(--gray-bg); color: var(--gray); text-decoration: line-through; }
.note-mark { font-size: 10px; color: var(--muted); padding-left: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.footer { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }

.backdrop { position: fixed; inset: 0; background: var(--shade); z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
  border-radius: 18px 18px 0 0; max-width: 640px; margin: 0 auto;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
}
.sheet h2 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; }
.sheet h2 span { flex: 1; }
.close { border: none; background: var(--gray-bg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
.row-label { font-size: 15px; font-weight: 600; margin-top: 6px; }
.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.choice { height: 50px; border-radius: 10px; border: 2px solid transparent; font-weight: 600; }
.choice.sel { border-color: var(--ink); }
.choices.off { opacity: .4; }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.toggle input { width: 22px; height: 22px; }
textarea { width: 100%; min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px; font: inherit; font-size: 16px; }
.wd-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd-pick label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd-pick input { width: 22px; height: 22px; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
</style>

<div class="wrap">
  <header>
    <button class="nav" id="prev" aria-label="上個月">‹</button>
    <h1 id="title"></h1>
    <button class="nav" id="next" aria-label="下個月">›</button>
  </header>
  <div class="legend">
    <span><i class="dot s-none"></i>還沒約</span>
    <span><i class="dot s-booked"></i>已預約，等結果</span>
    <span><i class="dot s-ok"></i>約成功</span>
    <span><i class="dot s-skip"></i>不用車</span>
  </div>
  <div class="summary" id="summary"></div>
  <div>
    <div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div><div class="we">日</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="footer">
    <button class="small-btn" id="todayBtn">回到本月</button>
    <button class="small-btn" id="settingsBtn">每週洗腎日</button>
  </div>
  <div class="sync" id="sync">連線中…</div>
</div>

<div class="backdrop" id="backdrop" hidden></div>

<div class="sheet" id="daySheet" hidden>
  <h2><span id="dayTitle"></span><button class="close" data-close aria-label="關閉">✕</button></h2>
  <div class="row-label">叫車狀態</div>
  <div class="choices" id="choices"></div>
  <label class="toggle"><input type="checkbox" id="dialToggle"> 這天要洗腎</label>
  <div class="row-label">備註（時間、車號…）</div>
  <textarea id="note" placeholder="例如：6:30 車號 ABC-1234"></textarea>
</div>

<div class="sheet" id="setSheet" hidden>
  <h2><span>每週洗腎日</span><button class="close" data-close aria-label="關閉">✕</button></h2>
  <div class="wd-pick" id="wdPick"></div>
  <p class="hint">勾選的星期會自動顯示叫車狀態。個別日子（例如國定假日改時間）可以點進那天調整。</p>
</div>

<script>
// 洗腎叫車月曆：資料存在 claude.ai 雲端，手機和電腦即時同步
const STATUS = [
  { id: '', label: '還沒約', mark: '未約', cls: 's-none' },
  { id: 'booked', label: '已預約', mark: '已約', cls: 's-booked' },
  { id: 'ok', label: '成功', mark: '成功', cls: 's-ok' },
  { id: 'skip', label: '不用車', mark: '免', cls: 's-skip' },
];
const WD_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
const $ = (id) => document.getElementById(id);

let db = null;
let canWrite = false;
let days = {};                     // { '2026-10-31': { go, note, dial } }
let cfg = { dialWeekdays: [2, 4, 6] }; // 週二、四、六
let view = firstOfMonth(new Date());
let openKey = null;

function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function keyOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateOf(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); }
function todayKey() { return keyOf(new Date()); }
function rec(key) { return days[key] || {}; }
function statusOf(id) { return STATUS.find((s) => s.id === (id || '')) || STATUS[0]; }
// 這天是否要洗腎：個別設定優先，否則看每週洗腎日
function isDial(key) {
  const r = rec(key);
  if (typeof r.dial === 'boolean') return r.dial;
  return cfg.dialWeekdays.includes(dateOf(key).getDay());
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  $('title').textContent = y + ' 年 ' + (m + 1) + ' 月';
  const grid = $('grid');
  grid.innerHTML = '';
  const lead = (view.getDay() + 6) % 7; // 週一為第一欄
  for (let i = 0; i < lead; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'cell empty' }));

  const tk = todayKey();
  const count = { none: 0, booked: 0, ok: 0 };
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const key = keyOf(new Date(y, m, d));
    const r = rec(key);
    const cell = document.createElement('button');
    cell.className = 'cell' + (key === tk ? ' today' : '') + (key < tk ? ' past' : '');
    cell.setAttribute('aria-label', (m + 1) + '月' + d + '日');
    cell.innerHTML = '<span class="num">' + d + '</span>';
    if (isDial(key)) {
      const s = statusOf(r.go);
      cell.insertAdjacentHTML('beforeend', '<span class="trip ' + s.cls + '">' + s.mark + '</span>');
      if (key >= tk) {
        if (s.id === '') count.none++;
        else if (s.id === 'booked') count.booked++;
        else if (s.id === 'ok') count.ok++;
      }
    }
    if (r.note) cell.insertAdjacentHTML('beforeend', '<span class="note-mark">' + escapeHtml(r.note) + '</span>');
    cell.addEventListener('click', () => openDay(key));
    grid.appendChild(cell);
  }

  const now = new Date();
  const notFuture = y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth());
  const scope = notFuture ? '本月今天起' : '這個月';
  if (count.none + count.booked + count.ok === 0) {
    $('summary').textContent = scope + '沒有需要叫車的日子。';
  } else {
    $('summary').innerHTML = scope + '：<b class="red">' + count.none + '</b> 天還沒約、<b class="yellow">' +
      count.booked + '</b> 天等結果、<b class="green">' + count.ok + '</b> 天已成功';
  }
}

// ---- 雲端讀寫 ----
function setSync(text, bad) { $('sync').textContent = text; $('sync').classList.toggle('bad', !!bad); }
const chains = {};
// 同一份文件一次只寫一筆，依序送出
function queueWrite(path, fn) {
  chains[path] = (chains[path] || Promise.resolve()).then(fn).then(
    () => setSync('已同步到雲端，手機和電腦都看得到'),
    (e) => setSync('儲存失敗（' + (e && e.code || e) + '），請重新整理後再試', true)
  );
}
function saveDay(key, r) {
  if (Object.keys(r).length) days[key] = r; else delete days[key];
  render();
  if (!db) return;
  setSync('儲存中…');
  const ref = db.collection('days').doc(key);
  const body = Object.assign({}, r);
  queueWrite(ref.path, () => (Object.keys(body).length ? ref.set(body) : ref.delete()));
}
function saveCfg() {
  render();
  if (!db) return;
  setSync('儲存中…');
  const body = { dialWeekdays: cfg.dialWeekdays.slice() };
  queueWrite('config/main', () => db.doc('config/main').set(body));
}

async function connect() {
  const c = window.claude;
  db = c ? await c.use('db') : null;
  if (!db) {
    setSync('沒有連上雲端，請用登入 Claude 的帳號開啟這個網頁；目前修改不會保存', true);
    return;
  }
  canWrite = true;
  try {
    const user = await c.use('user');
    if (user && (await user.can('data.write')) === false) canWrite = false;
  } catch (e) {}
  db.collection('days').onSnapshot((snap) => {
    const next = {};
    snap.docs.forEach((d) => { next[d.id] = d.data(); });
    days = next;
    render();
    if (openKey) fillChoices();
    setSync(canWrite ? '已同步到雲端，手機和電腦都看得到' : '你只能查看，不能修改');
  }, (e) => setSync('雲端連線中斷（' + e.code + '），請重新整理', true));
  db.doc('config/main').onSnapshot((snap) => {
    if (snap.exists && Array.isArray(snap.data().dialWeekdays)) cfg = { dialWeekdays: snap.data().dialWeekdays.slice() };
    render();
  }, () => {});
}

// ---- 單日視窗 ----
function openDay(key) {
  openKey = key;
  const d = dateOf(key);
  $('dayTitle').textContent = (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD_NAMES[d.getDay()] + '）';
  $('note').value = rec(key).note || '';
  $('note').disabled = !canWrite && !!db;
  fillChoices();
  show('daySheet');
}
function fillChoices() {
  const r = rec(openKey);
  const dial = isDial(openKey);
  $('dialToggle').checked = dial;
  $('dialToggle').disabled = !canWrite && !!db;
  const box = $('choices');
  box.innerHTML = '';
  box.classList.toggle('off', !dial);
  for (const s of STATUS) {
    const b = document.createElement('button');
    b.className = 'choice ' + s.cls + (dial && (r.go || '') === s.id ? ' sel' : '');
    b.textContent = s.label;
    b.disabled = !canWrite && !!db;
    b.addEventListener('click', () => {
      const patch = { go: s.id };
      if (!isDial(openKey)) patch.dial = true; // 非洗腎日點了狀態，就當作這天要用車
      update(patch);
      fillChoices();
    });
    box.appendChild(b);
  }
}
function update(patch) {
  const key = openKey;
  const r = Object.assign({}, rec(key), patch);
  for (const k of Object.keys(r)) if (r[k] === '' || r[k] === undefined) delete r[k];
  // 洗腎與否跟每週設定相同時就不另外記
  if (r.dial === cfg.dialWeekdays.includes(dateOf(key).getDay())) delete r.dial;
  saveDay(key, r);
}
$('dialToggle').addEventListener('change', (e) => { update({ dial: e.target.checked }); fillChoices(); });
let noteTimer = null;
function flushNote() {
  if (noteTimer === null || !openKey) return;
  clearTimeout(noteTimer);
  noteTimer = null;
  update({ note: $('note').value.trim() });
}
$('note').addEventListener('input', () => { clearTimeout(noteTimer); noteTimer = setTimeout(flushNote, 700); });
$('note').addEventListener('blur', flushNote);

// ---- 每週洗腎日 ----
function openSettings() {
  const box = $('wdPick');
  box.innerHTML = '';
  for (const wd of [1, 2, 3, 4, 5, 6, 0]) {
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'wd' + wd;
    cb.checked = cfg.dialWeekdays.includes(wd);
    cb.disabled = !canWrite && !!db;
    cb.addEventListener('change', () => {
      cfg.dialWeekdays = cfg.dialWeekdays.filter((x) => x !== wd);
      if (cb.checked) cfg.dialWeekdays.push(wd);
      saveCfg();
    });
    lab.append(WD_NAMES[wd], cb);
    box.appendChild(lab);
  }
  show('setSheet');
}

// ---- 視窗開關與導覽 ----
function show(id) { $('backdrop').hidden = false; $(id).hidden = false; }
function hide() {
  flushNote();
  $('backdrop').hidden = true;
  document.querySelectorAll('.sheet').forEach((s) => { s.hidden = true; });
  openKey = null;
}
$('backdrop').addEventListener('click', hide);
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', hide));
$('prev').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
$('next').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
$('todayBtn').addEventListener('click', () => { view = firstOfMonth(new Date()); render(); });
$('settingsBtn').addEventListener('click', openSettings);

// 左右滑動換月
let sx = null;
$('grid').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
$('grid').addEventListener('touchend', (e) => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  sx = null;
  if (Math.abs(dx) > 60) $(dx < 0 ? 'next' : 'prev').click();
});

render();
connect();
</script>
